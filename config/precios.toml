# Fallback price table, used only when the AWS Pricing API is unavailable
# (missing pricing:GetProducts permission, no network, or --precios-locales).
#
# Every value was copied from the public AWS Price List Bulk API (On-Demand terms).
# To verify a value, download the offer file for the region (replace {region})
# and search for the "usagetype" listed next to each price.

[fuentes.AmazonEC2]
url = "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonEC2/current/{region}/index.json"
publicacion = "2026-11-10T17:38:52Z"
consultado = "2026-11-12"

# us-east-1 usagetypes have no prefix; other regions use USE2-, SAE1-, etc.

[precios.us-east-1]
ebs_gp2_gb_mes = { usd = 0.10, fuente = "AmazonEC2", usagetype = "EBS:VolumeUsage.gp2" }
ebs_gp3_gb_mes = { usd = 0.08, fuente = "AmazonEC2", usagetype = "EBS:VolumeUsage.gp3" }
ebs_gp3_iops_mes = { usd = 0.005, fuente = "AmazonEC2", usagetype = "EBS:VolumeP-IOPS.gp3" }
ebs_gp3_mibps_mes = { usd = 0.04, fuente = "AmazonEC2", usagetype = "EBS:VolumeP-Throughput.gp3" }

